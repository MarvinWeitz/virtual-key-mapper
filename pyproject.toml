[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-key-mapper"
version = "0.1.2"
description = "Short-lived keys from your company gateway, labelled with the repository you work in, for every tool you use."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "cbs Corporate Business Solutions Unternehmensberatung GmbH" }]
keywords = ["llm", "gateway", "litellm", "sso", "virtual-keys", "cost-attribution", "claude-code", "codex", "opencode", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "filelock==4.0.9",
    "keyring==25.7.0",
]

[project.urls]
Homepage = "https://github.com/cbs-consulting/virtual-key-mapper"
Issues = "https://github.com/cbs-consulting/virtual-key-mapper/issues"
Changelog = "https://github.com/cbs-consulting/virtual-key-mapper/blob/main/CHANGELOG.md"

[project.scripts]
vkm = "virtual_key_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_key_mapper = ["ui/*"]
