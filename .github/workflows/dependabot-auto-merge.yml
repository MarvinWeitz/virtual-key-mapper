name: Dependabot auto-merge
# Approves Dependabot's minor and patch updates and turns on auto-merge, so they join the
# merge queue once the required checks pass and merge when they pass there too. Major
# updates can break things and wait for a person. Only npm and GitHub Actions updates are
# merged this way: Dependabot labels them "no changelog", so the changelog check passes.
# pip updates change what users install and wait for a person to add a changelog line.
#
# Needs these repository settings:
#   General -> Pull Requests: "Allow auto-merge"
#   Actions -> General -> Workflow permissions: "Allow GitHub Actions to create and approve
#   pull requests" (only if the branch rule requires an approval)
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Fails unless Actions may approve pull requests. That only matters when the branch
      # rule requires an approval, so auto-merge is turned on either way.
      - name: Approve
        if: steps.metadata.outputs.package-ecosystem != 'pip' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR"
      # The merge queue picks its own method; --squash is used when there is no queue.
      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem != 'pip' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
