name: Latest agents

# Weekly: the live tests with the newest Claude Code, Codex and OpenCode instead of the versions pinned in
# ci/agents. A failure here means a vendor change to look at before bumping the pins, not a broken main.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-latest:
    name: live-latest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require: claude,codex,opencode,bash,zsh,fish,pwsh
          - os: macos-latest
            require: claude,codex,opencode,bash,zsh,fish,pwsh
          - os: windows-latest
            require: claude,codex,opencode,bash,pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - if: runner.os == 'macOS'
        run: brew install fish
      - run: python -m pip install -e .
      - run: npm install --no-save --no-audit --no-fund @anthropic-ai/claude-code@latest @openai/codex@latest opencode-ai@latest
        working-directory: ci/agents
      # Prints the installed versions to the log.
      - run: node ci/agents/locate.mjs >> "$GITHUB_ENV"
        shell: bash
      - run: python -m unittest discover -s tests -v
        env:
          VKM_REQUIRE: ${{ matrix.require }}
