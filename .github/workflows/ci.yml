name: CLI checks

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and the pull requests queued
  # ahead of it, and waits for the required checks on that commit.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-cache-dir --no-deps --wheel-dir dist .
      - run: vkm --help

  # The whole suite with the real agents (pinned in ci/agents) and shells. Everything listed in
  # VKM_REQUIRE must be present: a missing tool fails instead of skipping.
  live:
    name: live (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require: claude,codex,opencode,bash,zsh,fish,pwsh
          - os: macos-latest
            require: claude,codex,opencode,bash,zsh,fish,pwsh
          - os: windows-latest
            require: claude,codex,opencode,bash,pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - if: runner.os == 'macOS'
        run: brew install fish
      - run: python -m pip install -e .
      # With install scripts: Claude Code and OpenCode put their native binary in place on install.
      - run: npm ci --no-audit --no-fund
        working-directory: ci/agents
      - run: node ci/agents/locate.mjs >> "$GITHUB_ENV"
        shell: bash
      - run: python -m unittest discover -s tests -v
        env:
          VKM_REQUIRE: ${{ matrix.require }}

  # The real OS credential vault: sign-in, renewal and logout against a fake gateway, and sessions
  # split across vault entries. Writes only uniquely named test entries.
  vault:
    name: vault (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VKM_TEST_VAULT: "1"
      VKM_REQUIRE: vault
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
      # Linux: a Secret Service in a private D-Bus session, unlocked like a desktop login would.
      - if: runner.os == 'Linux'
        run: >-
          dbus-run-session -- bash -c
          'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && python -m unittest discover -s tests -p "test_vault_native.py" -v'
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p "test_vault_native.py" -v

  # A real dev container (Dev Container CLI, Linux runner): the host signs in with its OS vault and runs the
  # companion's handler; inside, the relay, the CLI's forwarded sign-in and the pinned agents.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
      - run: python -m pip install -e .
      # The relay and the companion's handler run from the compiled extensions.
      - run: npm ci --ignore-scripts && npx tsc -p . && node node_modules/typescript/bin/tsc -p local
        working-directory: vscode-extension
      - run: dbus-run-session -- bash ci/devcontainer/host.sh

  # Both extensions on all three systems: unit tests, the relay against the real CLI (Linux, macOS),
  # and a real VS Code extension host with a fake CLI and gateway. Packaged once, on Linux.
  vscode-extension:
    name: vscode-extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require: relay
          - os: macos-latest
            require: relay
          - os: windows-latest
            require: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-extension
        shell: bash
    env:
      VKM_REQUIRE: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      # The CLI, for the test of the relay with the CLI's forwarded sign-in.
      - run: python -m pip install ..
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          VKM_TEST_PYTHON: python
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - if: runner.os != 'Linux'
        run: npm run test:host
      - if: runner.os == 'Linux'
        run: npm run package
      - run: npm test
        working-directory: vscode-extension/local
      - if: runner.os == 'Linux'
        run: npm run package
        working-directory: vscode-extension/local

  test-summary:
    # The single check that branch protection requires, so the rule does not have to list every
    # job and platform above. always() makes it run, and fail, when one of them fails; a skipped
    # required check would count as passing.
    name: Test features
    needs: [test, live, vault, devcontainer, vscode-extension]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in ${{ needs.test.result }} ${{ needs.live.result }} ${{ needs.vault.result }} \
              ${{ needs.devcontainer.result }} ${{ needs.vscode-extension.result }}; do
            test "$result" = "success"
          done
